<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pmkeyan.github.io/p/">
<meta property="og:title" content="Karthikeyan Murugan | Portfolio">
<meta property="og:description" content="Senior Visual & Digital Experience Designer. Web, e-commerce, email and campaign design. Private portfolio, password on request.">
<meta property="og:image" content="https://pmkeyan.github.io/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="627">
<meta name="twitter:card" content="summary_large_image">
<title>Karthikeyan Murugan | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Schibsted+Grotesk:wght@400;500;600&family=DM+Mono:wght@500&display=swap">
<style>
:root{--bg:#0B0B0D;--panel:#151518;--ink:#F3F1EC;--muted:#8F8D88;--line:#2a2a2f;--glow:#EAD9B0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-content:center;padding:24px 16px;overflow:hidden}
.shell{display:grid;grid-template-columns:minmax(0,440px) 300px;gap:clamp(40px,8vw,120px);align-items:center}
main{position:relative;min-width:0;z-index:2}
.me{position:relative;width:300px;justify-self:end;margin-right:10px}
.pic{width:100%;aspect-ratio:370/570;background:url(/og.png) no-repeat;background-size:324.3% auto;background-position:89.2% 52%}
.bub{position:absolute;right:86%;top:-6%;z-index:3;background:#FFF8E6;color:#141210;font:800 16px/1.15 "Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 85;padding:11px 16px 12px;border:3px solid #141210;border-radius:24px;white-space:nowrap;box-shadow:5px 6px 0 #141210;rotate:-5deg}
.bub b{color:#E0452B}
.bub::after{content:"";position:absolute;right:14px;bottom:-15px;width:22px;height:22px;background:#FFF8E6;border:3px solid #141210;border-top:0;border-left:0;clip-path:polygon(0 0,100% 0,100% 100%);transform:skewX(-28deg) rotate(8deg)}
@media (prefers-reduced-motion:no-preference){
  .me .fl{animation:bob 4.5s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-1.2deg)}}
  .bub{animation:popb .7s cubic-bezier(.3,1.5,.5,1) .5s both,wig 3.2s ease-in-out 1.6s infinite;transform-origin:100% 100%}
  @keyframes popb{from{scale:0}to{scale:1}}
  @keyframes wig{0%,70%,100%{rotate:-5deg}78%{rotate:2deg}86%{rotate:-8deg}93%{rotate:-3deg}}
}
@media (max-width:820px){
  body{overflow:auto;align-content:start;place-content:start center;padding-top:max(36px,env(safe-area-inset-top,0px))}
  .shell{grid-template-columns:minmax(0,440px);gap:8px}
  .me{order:-1;width:min(40vw,170px);justify-self:end;margin:30px 8px 0 0}
  .bub{font-size:12px;padding:7px 11px 8px;border-width:2px;border-radius:18px;box-shadow:3px 4px 0 #141210;right:auto;left:-110%;top:2%}
  .bub::after{right:10px;bottom:-11px;width:15px;height:15px;border-width:2px}
  h1{margin-top:6px}
}
.mono{font:500 12px/1.5 "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(44px,11vw,64px)/.9 "Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 80;letter-spacing:-.03em;margin:14px 0 18px}
h1 span{color:var(--glow)}
p{color:var(--muted);margin:0 0 26px}
form{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input:focus{outline:2px solid var(--glow);outline-offset:2px}
button{font-family:inherit;font-weight:600;font-size:16px;line-height:1;padding:0 22px;border-radius:12px;border:0;background:var(--glow);color:#141210;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:#FF7A6B;font-size:14px;min-height:22px;margin:10px 0 0}
.ask{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.ask a{color:var(--ink)}
@keyframes shake{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}
.shake{animation:shake .35s}
</style>
</head>
<body>
<div class="shell">
<main>
  <div class="mono">Private portfolio</div>
  <h1>Karthikeyan<br><span>Murugan</span></h1>
  <p>Senior Visual &amp; Digital Experience Designer. This portfolio is shared with hiring teams. Enter the password from your interview invite.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="Password" aria-label="Password" required autofocus>
    <button id="go" type="submit">Open</button>
  </form>
  <div class="err" id="err" role="alert"></div>
  <div class="ask">No password? Email <a href="mailto:pm.keyan@gmail.com?subject=Portfolio%20access">pm.keyan@gmail.com</a> or find me on <a href="https://www.linkedin.com/in/pmkeyan/" target="_blank" rel="noopener">LinkedIn</a>.</div>
</main>
<div class="me" aria-hidden="true"><div class="fl"><div class="pic"></div><span class="bub"><b>Vanakkam!</b> I'm Karthik 👋</span></div></div>
</div>
<script>
var P=null;
async function getP(){if(!P){var t=await (await fetch('/index.html',{cache:'no-cache'})).text();var m=t.match(/var P=(\{.*?\});/s);P=JSON.parse(m[1])}return P}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function open_(pw){
  await getP();
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(out);
}
async function tryPw(pw,quiet){
  var go=document.getElementById('go'),err=document.getElementById('err');
  go.disabled=true;go.textContent='Opening…';err.textContent='';
  try{
    var html=await open_(pw);
    try{sessionStorage.setItem('pf-pw',pw)}catch(_){}
    if(location.hash.indexOf('#k=')===0)history.replaceState(null,'',location.pathname);
    document.open();document.write(html);document.close();
  }catch(e){
    go.disabled=false;go.textContent='Open';
    if(!quiet){err.textContent='That password didn’t work. Check your invite and try again.';var f=document.getElementById('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
  }
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();tryPw(document.getElementById('pw').value.trim())});
(function(){
  var h=location.hash;if(h.indexOf('#k=')===0){tryPw(decodeURIComponent(h.slice(3)),true);return}
  var s=null;try{s=sessionStorage.getItem('pf-pw')}catch(_){}
  if(s)tryPw(s,true);
})();
</script>
</body>
</html>
